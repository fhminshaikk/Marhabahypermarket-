<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marhaba Hypermarket</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase Web SDK v9 (Modular via Compat for plain JS) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="logo-container">
      <img src="logo.png" alt="Marhaba Logo" class="app-logo" id="main-logo">
      <span class="brand-name">MARHABA</span>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="cart-btn" onclick="openCartModal()"><i class="fas fa-shopping-cart"></i><span id="cart-badge">0</span></button>
      <div class="dropdown">
        <button class="icon-btn"><i class="fas fa-map-marker-alt"></i></button>
        <div class="dropdown-content">
          <a href="https://maps.app.goo.gl/7ihuQEBx5pqGcPbz5" target="_blank"><i class="fas fa-store"></i> Othukkungal Branch</a>
          <a href="https://maps.app.goo.gl/oe4WV6SbhhM6DbYZ9" target="_blank"><i class="fas fa-store"></i> Karuvarakkund Branch</a>
        </div>
      </div>
      <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
      <a href="tel:9847283286" class="call-btn"><i class="fas fa-phone-alt"></i> Call</a>
      <button class="admin-login-link" onclick="openAdminModal()"><i class="fas fa-user-lock"></i> Admin</button>
    </div>
  </header>

  <!-- Search Bar -->
  <section class="search-container">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" placeholder="Search products, groceries, deals..." oninput="filterProducts()">
    </div>
  </section>

  <!-- Carousel Banner -->
  <section class="banner-slider">
    <div class="slides" id="banner-slides">
      <!-- Dynamic Banners Loaded Here -->
    </div>
    <div class="dots" id="banner-dots"></div>
  </section>

  <!-- Filter Categories -->
  <section class="filters-container">
    <button class="filter-chip active" onclick="filterCategory('All', this)">All</button>
    <button class="filter-chip" onclick="filterCategory('Vegetables', this)">Veg</button>
    <button class="filter-chip" onclick="filterCategory('Rice & Grains', this)">Rice</button>
    <button class="filter-chip" onclick="filterCategory('Beverages', this)">Bev</button>
    <button class="filter-chip" onclick="filterCategory('Snacks & Spices', this)">Snacks</button>
    <button class="filter-chip" onclick="filterCategory('Household', this)">Household</button>
  </section>

  <!-- Product Grid -->
  <main class="products-grid" id="products-grid">
    <!-- Dynamic Products Rendered Here -->
  </main>

  <!-- Product Detail Modal -->
  <div class="modal" id="product-modal">
    <div class="modal-content product-detail-card">
      <span class="close-btn" onclick="closeProductModal()">&times;</span>
      <div class="modal-img-container">
        <img id="modal-img" src="" alt="Product Image">
      </div>
      <h2 id="modal-title">Product Name</h2>
      <p id="modal-unit" class="modal-unit"></p>
      <div class="modal-price-box">
        <span id="modal-price" class="current-price"></span>
        <span id="modal-mrp" class="mrp-price"></span>
      </div>
      <p id="modal-description" class="modal-desc"></p>
      
      <div class="quantity-controls">
        <button onclick="changeQty(-1)"><i class="fas fa-minus"></i></button>
        <span id="modal-qty">1</span>
        <button onclick="changeQty(1)"><i class="fas fa-plus"></i></button>
      </div>

      <div class="action-buttons">
        <button class="btn btn-cart" onclick="addCurrentToCart()"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        <button class="btn btn-wa" onclick="openOrderModal('single')"><i class="fab fa-whatsapp"></i> Buy via WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCartModal()">&times;</span>
      <h2>Your Shopping Cart</h2>
      <div id="cart-items-container"></div>
      <div class="cart-summary">
        Total: ₹<span id="cart-total-price">0</span>
      </div>
      <button class="btn btn-wa full-width" onclick="openOrderModal('cart')"><i class="fab fa-whatsapp"></i> Order All via WhatsApp</button>
    </div>
  </div>

  <!-- Order / Address Modal -->
  <div class="modal" id="order-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeOrderModal()">&times;</span>
      <h2>Customer Details</h2>
      <form id="order-form" onsubmit="submitWhatsAppOrder(event)">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="cust-name" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="cust-phone" required placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
          <label>Delivery Address *</label>
          <textarea id="cust-address" required placeholder="Enter your complete home address"></textarea>
        </div>
        <button type="submit" class="btn btn-wa full-width"><i class="fab fa-whatsapp"></i> Confirm Order & Send WhatsApp</button>
      </form>
    </div>
  </div>

  <!-- Admin Authentication & Management Modal -->
  <div class="modal" id="admin-modal">
    <div class="modal-content admin-card">
      <span class="close-btn" onclick="closeAdminModal()">&times;</span>
      
      <!-- Login View -->
      <div id="admin-login-view">
        <h2>Admin Portal Access</h2>
        <form onsubmit="handleAdminLogin(event)">
          <div class="form-group">
            <label>Email ID</label>
            <input type="email" id="admin-email" required placeholder="admin@marhabahypermarket.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="admin-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary full-width">Login</button>
        </form>
      </div>

      <!-- Dashboard View -->
      <div id="admin-dashboard-view" style="display:none;">
        <div class="dashboard-header">
          <h2>Store Management</h2>
          <button class="btn btn-danger btn-sm" onclick="handleAdminLogout()">Logout</button>
        </div>

        <div class="admin-tabs">
          <button class="tab-btn active" onclick="switchAdminTab('manage-products')">Products</button>
          <button class="tab-btn" onclick="switchAdminTab('manage-banners')">Banners</button>
        </div>

        <!-- Manage Products Tab -->
        <div id="manage-products" class="tab-content active">
          <h3>Add / Update Product</h3>
          <form id="product-form" onsubmit="saveProduct(event)">
            <input type="hidden" id="prod-id">
            <div class="form-group">
              <label>Product Name</label>
              <input type="text" id="prod-name" required>
            </div>
            <div class="form-group">
              <label>Category</label>
              <select id="prod-category">
                <option value="Vegetables">Vegetables</option>
                <option value="Rice & Grains">Rice & Grains</option>
                <option value="Beverages">Beverages</option>
                <option value="Snacks & Spices">Snacks & Spices</option>
                <option value="Household">Household</option>
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Offer Price (₹)</label>
                <input type="number" id="prod-price" required>
              </div>
              <div class="form-group">
                <label>MRP (₹)</label>
                <input type="number" id="prod-mrp">
              </div>
            </div>
            <div class="form-group">
              <label>Unit/Quantity (e.g., 1 kg, 500 ml)</label>
              <input type="text" id="prod-unit" required>
            </div>
            <div class="form-group">
              <label>Image URL</label>
              <input type="url" id="prod-image" required placeholder="https://example.com/image.jpg">
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="prod-desc"></textarea>
            </div>
            <button type="submit" class="btn btn-primary full-width">Save Product</button>
          </form>
          <hr>
          <h3>Product Inventory List</h3>
          <div id="admin-product-list" class="admin-item-list"></div>
        </div>

        <!-- Manage Banners Tab -->
        <div id="manage-banners" class="tab-content">
          <h3>Add Promo Banner</h3>
          <form id="banner-form" onsubmit="saveBanner(event)">
            <div class="form-group">
              <label>Banner Title / Description</label>
              <input type="text" id="banner-title" required>
            </div>
            <div class="form-group">
              <label>Banner Image URL</label>
              <input type="url" id="banner-image" required placeholder="https://example.com/banner.jpg">
            </div>
            <button type="submit" class="btn btn-primary full-width">Add Banner</button>
          </form>
          <hr>
          <h3>Active Banners</h3>
          <div id="admin-banner-list" class="admin-item-list"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
